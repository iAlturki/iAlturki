<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
<title>ytr-music: the native miniplayer docked above the taskbar expands into a player card on hover. Built on pear-desktop.</title>
<style>
.mp{transform-box:view-box;transform-origin:186px 110px;animation:mp 7000ms infinite}
@keyframes mp{0%,18%{transform:scale(0.129,0.714)}26%,78%{transform:none;animation-timing-function:cubic-bezier(.2,.9,.25,1)}86%,100%{transform:scale(0.129,0.714)}}
.mp{animation-timing-function:cubic-bezier(.2,.9,.25,1)}
.dock{animation:dock 7000ms infinite}@keyframes dock{0%,18%{opacity:1}21%,82%{opacity:0}86%,100%{opacity:1}}
.full{opacity:0;animation:full 7000ms infinite}@keyframes full{0%,23%{opacity:0}27%,76%{opacity:1}80%,100%{opacity:0}}
.seek{transform-box:fill-box;transform-origin:0 50%;animation:seek 7000ms linear infinite}@keyframes seek{0%,26%{transform:scaleX(.18)}78%,100%{transform:scaleX(.72)}}
.ptr{animation:ptr 7000ms infinite}
@keyframes ptr{0%{transform:translate(200px,70px)}16%{transform:translate(174px,70px)}78%{transform:translate(146px,72px)}92%,100%{transform:translate(200px,70px)}}
@media (prefers-reduced-motion:reduce){.full{opacity:1}.dock,.ptr{opacity:0}.mp{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="199" height="239" rx="16" fill="#15171F" stroke="#2A2F3B"/>

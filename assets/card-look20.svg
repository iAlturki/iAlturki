<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
<title>Look20: a pixel-art eye bubble slides out from behind the seam on two monitors and counts down. 172 KB.</title>
<style>
.sa{animation:sa 8000ms infinite}.sb{animation:sb 8000ms infinite}
@keyframes sa{0%,8%{transform:translateX(73.4px)}13.25%,75%{transform:none;animation-timing-function:cubic-bezier(.333,1,.667,1)}80.25%,100%{transform:translateX(73.4px)}}
@keyframes sb{0%,8%{transform:translateX(-59.32px)}13.25%,75%{transform:none}80.25%,100%{transform:translateX(-59.32px)}}
.drain{transform-box:fill-box;transform-origin:100% 50%;animation:drain 8000ms infinite}
@keyframes drain{0%,13.25%{transform:scaleX(0)}75%,100%{transform:scaleX(1)}}
.lid{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);animation:blink 3s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.sa,.sb{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="199" height="239" rx="16" fill="#15171F" stroke="#2A2F3B"/>
<clipPath id="scr"><rect x="8" y="8" width="184" height="116" rx="10"/></clipPath>
<g clip-path="url(#scr)"><rect x="8" y="8" width="184" height="116" fill="#0D0F14"/><rect x="12" y="24" width="112" height="68" rx="3" fill="#1B1F29"/><rect x="14" y="26" width="108" height="64" fill="#10131A"/>
<rect x="126" y="12" width="56" height="96" rx="3" fill="#1B1F29"/><rect x="128" y="14" width="52" height="92" fill="#10131A"/>
<clipPath id="ca"><rect x="14" y="26" width="108" height="64"/></clipPath><clipPath id="cb"><rect x="128" y="14" width="52" height="92"/></clipPath>
<g clip-path="url(#ca)"><g class="sa"><g transform="translate(48.6 45.24)"><image width="70.4" height="25.52" href="data:image/png;base64," style="image-rendering:pixelated"/><rect class="lid" x="4.4" y="5.72" width="14.52" height="13.2" fill="#1E2334"/><rect class="drain" x="22" y="16.28" width="44" height="1.76" fill="#30374E"/></g></g></g>
<g clip-path="url(#cb)"><g class="sb"><g transform="translate(131 47.79)"><image width="56.32" height="20.42" href="data:image/png;base64," style="image-rendering:pixelated"/><rect class="lid" x="3.52" y="4.58" width="11.62" height="10.56" fill="#1E2334"/><rect class="drain" x="17.6" y="13.02" width="35.2" height="1.41" fill="#30374E"/></g></g></g>
<text x="122" y="102" font-size="7.5" fill="#7A8296" text-anchor="end">120 DPI</text><text x="128" y="118" font-size="7.5" fill="#7A8296">96 DPI</text></g>
<rect x="8.5" y="8.5" width="183" height="115" rx="9.5" fill="none" stroke="#fff" stroke-opacity=".06"/>
<rect x="18" y="143" width="8" height="8" rx="2" fill="#609CFF"/>
<text x="33" y="151.5" font-size="15" font-weight="600" fill="#F2F3F7">Look20</text>
<text x="18" y="174" font-size="11.5" fill="#A3AAB8">Look away, every 20 minutes.</text>
<text x="18" y="200" font-size="11"><tspan fill="#F2F3F7" font-weight="600">172</tspan><tspan fill="#8B93A5"> KB</tspan><tspan dx="9"> </tspan><tspan fill="#F2F3F7" font-weight="600">Every</tspan><tspan fill="#8B93A5"> monitor</tspan></text>
<text x="18" y="224" font-size="10.5" fill="#6B7385">Open on GitHub</text>
<path d="M174 220.5h8m-3-3 3 3-3 3" stroke="#6B7385" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>